name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it publishes the zip.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .cache/runtime
          key: runtime-${{ hashFiles('pnpm-lock.yaml', 'runtime.json', 'runtime-requirements.txt') }}
      # Downloads the pinned files, and fails if a release has no wheel Pyodide can load.
      - run: pnpm runtime
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:casparser
      # Builds the add-on and checks the zip against Wealthfolio's limits.
      - run: pnpm bundle
      # A release publishes this zip.
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/*.zip
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Playwright's image has Node 24, the browsers and the Ubuntu packages they need; downloading
    # those packages took some runs past the time limit. Its tag must match playwright-core in
    # package.json, so change the two together.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .cache/runtime
          key: runtime-${{ hashFiles('pnpm-lock.yaml', 'runtime.json', 'runtime-requirements.txt') }}
      - run: pnpm runtime
      - run: pnpm test:browser chromium firefox webkit
